<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hopi Farms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="brand/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="hud">
      <button class="nameplate" data-action="rename" title="Rename your farm">
        <span class="avatar" id="avatar"></span>
        <span id="farm-name">Farmer</span>
      </button>
      <div class="hud-crop" id="hud-crop" hidden>
        <button class="ca-pill" data-action="copy" id="ca-pill" title="Copy the $CROP contract address">
          <span class="ca-label">$CROP CA</span><code id="ca-short"></code><span class="ca-copy">Copy</span>
        </button>
        <a class="ca-buy" id="ca-buy" target="_blank" rel="noopener noreferrer">Buy</a>
        <button class="btn orange" data-action="deposit">Deposit $CROP</button>
      </div>
      <div class="pills">
        <div class="pill" title="$CROP"><span id="ico-coin"></span><b id="coins">0</b><small class="unit">$CROP</small></div>
        <div class="pill" title="Gems"><span id="ico-gem"></span><b id="gems">0</b><small class="unit">gems</small></div>
        <div class="pill" title="Valley level and RTP"><span class="lv">LV</span><b id="level">0</b><small id="rtp"></small></div>
        <div class="pill" title="Farmer XP"><span id="ico-xp"></span><b id="xp">0</b><small class="unit">XP</small></div>
        <a class="pill sound-btn docs-btn" href="/docs" target="_blank" rel="noopener" title="How to play: rules, odds, prizes">Docs</a>
        <button class="pill sound-btn" data-tab-go="leaders" title="Top farmers by XP">Leaderboard</button>
        <button class="pill sound-btn" id="sound-btn" data-action="sound" title="Turn sound effects on or off">Sound on</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Locations">
      <button data-tab="valley" data-icon="bush">Valley</button>
      <button data-tab="house" data-icon="chest_wooden">House</button>
      <button data-tab="farm" data-icon="stage:3">Farm<span class="badge" hidden></span></button>
      <button data-tab="market" data-icon="pack_basic">Market</button>
      <button data-tab="potions" data-icon="elixir">Potions</button>
      <button data-tab="backpack" data-icon="fertilizer">Backpack</button>
      <button data-tab="history" data-icon="ledger">My History</button>
      <button data-tab="withdraw" data-icon="coin">Withdraw</button>
      <button data-tab="auction" data-icon="gavel">Auction</button>
      <button data-tab="lottery" data-icon="ticket">Lottery</button>
    </nav>

    <main id="view"></main>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="modal" class="modal" hidden><div class="panel" id="modal-panel"></div></div>
  <div id="toasts" class="toasts"></div>
  <div id="dev" class="dev" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
