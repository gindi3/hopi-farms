# nginx site for hopifarms.fun, behind Cloudflare (SSL mode: Full (strict)).
# Installed by deploy/setup.sh to /etc/nginx/sites-available/hopifarms.fun.
#
# Needs:
#   /etc/ssl/hopifarms/origin.pem   Cloudflare Origin Certificate
#   /etc/ssl/hopifarms/origin.key   its private key
#   /etc/nginx/snippets/cloudflare-realip.conf   (written by setup.sh from Cloudflare's IP list)

upstream hopi_farms {
    server 127.0.0.1:5180;
    keepalive 16;
}

# Plain HTTP: send everyone to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name hopifarms.fun www.hopifarms.fun;
    return 301 https://hopifarms.fun$request_uri;
}

# www → bare domain.
server {
    # 'listen ... http2' works on every nginx version (1.25+ prints a deprecation notice).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hopifarms.fun;

    ssl_certificate     /etc/ssl/hopifarms/origin.pem;
    ssl_certificate_key /etc/ssl/hopifarms/origin.key;

    return 301 https://hopifarms.fun$request_uri;
}

server {
    # 'listen ... http2' works on every nginx version (1.25+ prints a deprecation notice).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hopifarms.fun;

    ssl_certificate     /etc/ssl/hopifarms/origin.pem;
    ssl_certificate_key /etc/ssl/hopifarms/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Use the visitor's real IP (Cloudflare sends it in CF-Connecting-IP).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://hopi_farms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so the app sees exactly one, trusted client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
